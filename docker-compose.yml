name: easyrag

services:
  # =========================================================================
  # Milvus 向量数据库
  # =========================================================================
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-s3:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.14
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio-s3:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
    depends_on:
      - "etcd"
      - "minio-s3"

  # =========================================================================
  # PostgreSQL — 用户/会话/知识库元数据
  # =========================================================================
  postgres:
    container_name: easyrag-postgres
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: easyrag
      POSTGRES_PASSWORD: easyrag_secret
      POSTGRES_DB: easyrag
    ports:
      - "5432:5432"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyrag"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Redis — 缓存 / 会话 / 任务队列
  # =========================================================================
  redis:
    container_name: easyrag-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # MinIO — 文件/文档对象存储
  # =========================================================================
  minio:
    container_name: easyrag-minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: easyrag_admin
      MINIO_ROOT_PASSWORD: easyrag_minio_secret
    ports:
      - "9090:9090"    # Console
      - "9091:9000"    # API (映射到 9091 避免与 Milvus 的 minio 冲突)
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio_app:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # =========================================================================
  # MinerU — 独立文档解析服务 (GPU)
  # 原 deploy/mineru/compose.yml 已合并到此文件
  # =========================================================================
  mineru-api:
    container_name: easyrag-mineru-api
    build:
      context: ./deploy/mineru
      args:
        MINERU_VERSION: ${MINERU_VERSION:-3.4.4}
        MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
    image: easyrag/mineru-pipeline:${MINERU_VERSION:-3.4.4}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINERU_PORT:-18000}:8000"
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_API_OUTPUT_ROOT: /opt/mineru/output
      MINERU_API_TASK_RETENTION_SECONDS: ${MINERU_TASK_RETENTION_SECONDS:-86400}
      MINERU_API_TASK_CLEANUP_INTERVAL_SECONDS: ${MINERU_TASK_CLEANUP_INTERVAL_SECONDS:-300}
      MINERU_API_MAX_CONCURRENT_REQUESTS: ${MINERU_MAX_CONCURRENT_REQUESTS:-1}
      MINERU_PROCESSING_WINDOW_SIZE: ${MINERU_PROCESSING_WINDOW_SIZE:-16}
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - mineru-output:/opt/mineru/output
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

volumes:
  mineru-output:
    name: easyrag-mineru-output

networks:
  default:
    name: easyrag
