<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session status regression</title>
<div id="app" style="height:100vh;width:100%"></div>
<script type="module">
import { createApp, h } from 'vue'
import { createPinia } from 'pinia'
import { createRouter, createMemoryHistory } from 'vue-router'
import ChatView from '../src/views/ChatView.vue'
import api from '../src/api/index.js'
import { useChatStore } from '../src/stores/chat.js'
import '../src/style.css'
// Isolated UI fixture; all requests stay in memory.
const files = []
const file = { id: '11111111-1111-4111-8111-111111111111', kind: 'file', title: '分析报告.md', filename: '分析报告.md', size: 100, download_url: '/artifacts/22222222-2222-4222-8222-222222222222/11111111-1111-4111-8111-111111111111' }
api.getBlob = async path => {
  if (path !== file.download_url) throw new Error('Unexpected download')
  document.body.dataset.downloaded = file.filename
  return { data: new Blob(['# 报告\n内容'], { type: 'text/markdown' }) }
}
api.get = async path => {
  if (path.endsWith('/preview') && path.split('/').length === 5) return { kind: 'html', content: '<h1>分析报告</h1><p>这是可预览的报告。</p>' }
  if (path.startsWith('/artifacts/')) return { artifacts: [...files] }
  if (path.endsWith('/models')) return { models: [{ id: 'demo', name: 'Demo Model', provider: 'Demo', available: true }], context_window: 200000 }
  if (path.endsWith('/skills')) return { skills: [], max_selected: 10 }
  if (path.endsWith('/context')) return { has_summary: true, folded_messages: 68, message_count: 88, kept_window: 20, compactable: 16 }
  if (path.endsWith('/history')) return { messages: [{ role: 'user', content: '整理这份材料。' }, { role: 'assistant', content: '材料已整理。', meta: { model_name: 'Demo Model', token_usage: { input_tokens: 30000, output_tokens: 300, total_tokens: 30300 }, context_usage: { input_tokens: 12000, output_tokens: 100, total_tokens: 12100 } } }] }
  if (path.endsWith('/conversations')) return [{ id: 'preview', title: 'Preview' }]
  return {}
}
api.delete = async () => ({})
// /compact：上下文压缩接口（隔离 fixture，不发真实请求）
api.post = async path => {
  if (String(path).endsWith('/compact')) {
    return {
      compacted: true,
      complete: true,
      reason: '',
      message: '已折叠 64 条历史消息，上下文窗口已收缩。',
      message_count: 84,
      newly_folded: 64,
      folded_messages: 64,
      kept_messages: 20,
      batches: 2,
      tokens_before: 18400,
      tokens_after: 3200,
      summary: [
        '当前目标：分析 volumes/workspace 下 3 个合同扫描 PDF，提取甲乙方与违约条款，整理为 docx。',
        '关键事实与约束：甲乙方为 A 公司 / B 公司；第 7.2 条逾期付款按日 0.05%，上限 20%；付款节点 30 日 40%、60 日 60%；格式基准 /data/kb/合同模板.md。',
        '已完成：生成 合同要点.docx（5 行条款）；kb_search 命中 2 篇类似案例。',
        '重要决定：以模板文件为排版基准，统一标题层级。',
        '未完成事项：等待确认是否需要补充违约金上限的计算示例。',
      ].join('\n'),
    }
  }
  return {}
}
let callback, complete
api.streamChat = async (url, body, cb, { signal }) => {
  callback = cb
  cb({ type: 'agent_event', event: { id: 'root', type: 'agent_start', status: 'running', timestamp: new Date().toISOString(), metadata: {} } })
  return new Promise((resolve, reject) => { complete = resolve; signal.addEventListener('abort', () => reject(new DOMException('Aborted', 'AbortError')), { once: true }) })
}
const emit = event => callback?.(event)
const actions = {
  file: () => {
    if (!files.length) files.push(file)
    emit({ type: 'agent_event', event: { id: 'file-created', type: 'file_operation', status: 'completed', metadata: { artifact: file } } })
  },
  history: () => { useChatStore(pinia).selectConversation(null); setTimeout(() => useChatStore(pinia).selectConversation('preview'), 0) },
  task1: () => emit({ type: 'sub_tasks', tasks: [{ task_id: 'a', goal: '检索资料', worker_hint: 'rag' }] }),
  result: () => emit({ type: 'worker_output', task_id: 'a', status: 'done', worker: 'rag', content: '检索报告：已找到相关材料。' }),
  task2: () => emit({ type: 'sub_tasks', tasks: [{ task_id: 'a', goal: '检索资料' }, { task_id: 'b', goal: '交叉验证', worker_hint: 'rag' }] }),
  usage: () => emit({ type: 'agent_event', event: { id: 'usage', type: 'planning', status: 'completed', timestamp: new Date().toISOString(), metadata: { stage: 'model_usage', token_usage: { input_tokens: 45000, output_tokens: 450, total_tokens: 45450 }, context_usage: { input_tokens: 15000, output_tokens: 150, total_tokens: 15150 } } } }),
  done: () => { emit({ type: 'done', content: '处理完成。', elapsed_seconds: 3 }); complete?.() },
  compact: () => {
    const area = document.querySelector('textarea')
    if (!area) return
    area.value = '/compact'
    area.dispatchEvent(new Event('input', { bubbles: true }))
    setTimeout(() => document.querySelector('.btn-send')?.click(), 60)
  },
}
const pinia = createPinia()
const router = createRouter({ history: createMemoryHistory(), routes: [{ path: '/', component: ChatView }] })
await router.push('/')
createApp({ render: () => h('div', { style: 'height:100%' }, [
  h('nav', { style: 'position:fixed;top:5px;left:8px;z-index:20;display:flex;gap:6px', 'aria-label': 'Test controls' }, Object.entries(actions).map(([key, action]) => h('button', { onClick: action, 'data-action': key }, key))),
  h(ChatView),
]) }).use(pinia).use(router).mount('#app')
useChatStore(pinia).selectConversation('preview')
// ?action=compact 自动跑一遍 /compact 流程（供无头截图/回归使用）
if (new URLSearchParams(location.search).get('action') === 'compact') {
  setTimeout(() => actions.compact(), 500)
  if (new URLSearchParams(location.search).get('expand') === '1') {
    setTimeout(() => document.querySelector('.context-compact-toggle')?.click(), 1400)
  }
}
</script>
</html>
