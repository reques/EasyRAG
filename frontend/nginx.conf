server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent replies use SSE and may run for several minutes.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 必须每次回源校验：Vite 的 JS/CSS 文件名带内容哈希，
    # 但入口 HTML 文件名固定。若 HTML 被浏览器启发式缓存，重建镜像后
    # 用户仍加载旧哈希的 bundle，新代码永远不生效（无 ETag 之外的失效手段）。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 带内容哈希的静态资源可长期强缓存；文件名变了 URL 就变了，无需回源。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
